<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> informações de um aluno </title>
</head>

<style>
    table{
        border-collapse: collapse;
    }
    table, th, td {
        border: 1px solid black;
    }
    th,td{
        padding: 16px;
        text-align: center;
    }
</style>

<body>
    <h1> informações de um aluno </h1>

    <div id="output">
        <!-- <h2>Nome</h2>
        <p>Notas: </p>
        <ul>
            <li>1</li>
            <li>3</li>
            <li>3</li>
            <li>8</li>
        </ul>
        <p>Média: 3.75</p>
        <p>Aprovado? não</p> -->

        <script>
            const aluno = {
                nome: "Pedro",
                notas: [1, 3, 3, 8],
            }

            const output = document.getElementById("output");
            output.innerHTML = "<h2>Aluno: " + aluno.nome + "</h2>";
            output.innerHTML += "<p>Notas: </p>";
            output.innerHTML += "<ul>";
                let soma = 0;
                for (let i = 0; i < aluno.notas.length; i++) {
                    soma += aluno.notas[i];
                    output.innerHTML += "<li>" + aluno.notas[i] + "</li>";
                }
                let media = soma / aluno.notas.length;
            output.innerHTML += "</ul>";

            output.innerHTML += "<p>Média: " + media + "</p>";
            output.innerHTML += "<p>Aprovado? " + (media >= 7 ? "sim" : "não") + "</p>";
        </script>
    </div>
