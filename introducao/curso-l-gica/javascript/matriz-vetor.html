<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> vetor, array, lista e matriz</title>
</head>

<body>
    <h1>vetor, array, lista e matriz</h1>
        <script>
            const notas = [[3, 5, 6, 1], [2,8, 4, 9], [10, 3, 5, 7]];

            document.write("terceira nota do segundo aluno: " + notas[1][2]); // 4
            document.write("<br>");
            document.write("segunda nota do terceiro aluno:" + notas[2][1]); // 3
            document.write("<br>");

            for (let i = 0; i < notas.length; i++) {
                const notasAluno = notas[i];
                document.write(notasAluno);
                document.write("<br>");

                for (let j = 0; j < notasAluno.length; j++) {
                    document.write(notasAluno[j]);
                }
            }
        </script>
</body>
    </div>
