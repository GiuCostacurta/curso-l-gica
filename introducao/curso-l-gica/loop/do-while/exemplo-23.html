<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Vigésimo terceiro exemplo</h1>
    <h2>Loops</h2>

    <script>
      // criar um número randomico
      let dado1 = parseInt(Math.random() * 6 + 1);
      let dado2 = parseInt(Math.random() * 6 + 1);

      let contador = 1;

      do{
        document.write("dado 1: " + dado1 + "<br>");
        document.write("dado 2: " + dado2 + "<br>");
        document.write("<br>");
        contador++;
        dado1 = parseInt(Math.random() * 6 + 1);
        dado2 = parseInt(Math.random() * 6 + 1);
      } while (dado1 != dado2) 
      
      document.write("os dados foram jogados " + contador + " vezes. E o numero repetido foi o " + dado1);


    </script>
  </body>
</html>
