<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Vigésimo quarto exemplo</h1>
    <h2>Loops</h2>

    <script>
      let num = parseInt(prompt("Digite um número:"));

      let i = 2;

      do {
        document.write(i + "<br>");
        i += 2;
      } while (i <= num);

    </script>
  </body>
</html>
