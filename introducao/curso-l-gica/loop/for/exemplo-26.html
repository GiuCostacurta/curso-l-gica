<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Vigésimo sexto exemplo</h1>
    <h2>Loops</h2>

    <script>
      let contador = 0;

      for (let ano = 1004; ano <= 2024; ano += 4) {
        contador++;
          document.write(ano + "<br>");
      }

      document.write(contador + "<br>");
    </script>
  </body>
</html>
