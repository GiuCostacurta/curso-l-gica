<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Vigésimo quinto exemplo</h1>
    <h2>Loops</h2>

    <script>
      let num = parseInt(prompt("Digite um número:"));

      for(let contador = 1; contador <= 1000; contador++){
        document.write(num + " x " + contador + ": " + num * contador + "<br>");

        if(contador % 10 == 0){
          document.write("<hr>");
        }
      }

    </script>
  </body>
</html>
