<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Vigésimo sétimo exemplo</h1>
    <h2>break & continue</h2>
    <!-- o break interrompe o loop e o continue pula para a próxima iteração -->

    <script>
      for(let i = 1; i < 10; i++){
        document.write(i + ", ")
        if (i === 5){
          break
        }
        // para de mostrar os números quando chegar no 5
      }
        document.write("<br>")
        document.write("Fim do loop com break")
        document.write("<br>")

        for(let i = 1; i < 10; i++){
          if (i === 5){
            continue
          }
        //   pula o número 5 e passa para o próximo
          document.write(i + ", ")
        }
        document.write("<br>")
        document.write("Fim do loop com continue")
    </script>
  </body>
</html>
