<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Trigésimo exemplo</h1>
    <h2>break & continue</h2>
    <!-- o break interrompe o loop e o continue pula para a próxima iteração -->

    <script>
      for (let i = 0; i <= 100; i++) {
        if (i % 10 === 0) {
          continue;
        }
        document.write(i + "<br>");

        let sorteio = Math.floor(Math.random() * 100) + 1;
        document.write("sorteio: " + sorteio + "<br>");

        if (i % sorteio === 0) {
          break;
        }
      }
    </script>
  </body>
</html>
