<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Décimo nono exemplo</h1>
    <h2>condições</h2>

    <script>
      let myVar = "exemplo";

      switch (typeof myVar) {
        case "number":
          alert("myVar é um número");
          break;
        case "string":
          alert("myVar é uma string");
          break;
        case "boolean":
          alert("myVar é um booleano");
          break;
        case "indefined":
          alert("myVar é indefinido");
          break;
        default:
          alert("nenhum tipo conhecido");
      }
    </script>
  </body>
</html>
