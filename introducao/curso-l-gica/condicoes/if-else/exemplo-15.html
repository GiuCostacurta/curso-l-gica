<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Décimo quinto exemplo</h1>
    <h2>condições</h2>

    <script>
      let n1 = parseFloat(prompt("digite a nota 1"));
      let n2 = parseFloat(prompt("digite a nota 2"));

      if (n1 > 10 || n2 > 10) {
        alert("digite apenas numeros menores que 10");
      } else {
        let media = (n1 + n2) / 2;
        if (media > 4 && n1 != 0 && n2 != 0) {
          alert("Aprovado");
        } else {
          alert("Reprovado");
        }
      }

      alert("fim do programa");
    </script>
  </body>
</html>
