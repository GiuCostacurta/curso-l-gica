<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Document </title>
</head>

<body>
    <h1>Oitavo exemplo</h1>
    <h2> operadores comparação</h2>

    <script >
        //um sinal de igual = não é usado para comparação mas sim para atribuição
            //exemplo: var a = 5; (a variável a recebe o valor 5)
        //dois sinais de igual == comparam apenas o valor 
            // exemlpo: 5 == "5" true
        //três sinais de igual === comparam o valor e o tipo 
        // exemplo: 5 === "5" false

        let n1 = parseFloat(prompt("digite um número de 0 a 10"));
        let n2 = parseFloat(prompt("digite outro número de 0 a 10"));

        alert("o segundo número é maior ou igual ao primeiro? " + (n2 >= n1));
    </script>

</body>

</html>
