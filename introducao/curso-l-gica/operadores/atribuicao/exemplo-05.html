<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Document </title>
</head>

<body>
    <h1>Quinto exemplo</h1>
    <h2> operadores atribuição</h2>

    <script >
        //crie uma variavel e atribua um valor
        var a = 10;
        alert("o valor da variável a é " + a);

        //some 5 a essa variavel e reatribua o valor
        a += 5;
        alert("o valor da variável a é " + a);

        //multiplique o valor da variavel por 5 e reatribua o valor
        a *= 5;
        alert("o valor da variável a é " + a);

        //some 1 a variavel e reatribua o valor
        a ++
        alert("o valor da variável a é " + a);
        
        //sem alterar o valor da variável, mostre na tela o resto da divisão por 6
        //a mensagem deve ser: "o resto da divisão de a por 6 é (resultado)"
        alert("o resto da divisão de " + a + " por 6 é " + (a % 6));
        
        //sem alterar o valor da variável, mostre na tela o resto da divisão por 6 elevado ao quadrado
        //a mensagem deve ser: "o quadrado do resto da divisão de a por 6 é (resultado)"
        alert("o quadrado do resto da divisão de " + a + " por 6 é " + (a % 6) ** 2);
        
        //mostre na tela o valor da variável a
        alert("o valor da variável a é " + a);
        
        //agora divida o valor da variável a por 4 e reatribua o valor
        a = a / 4;
        
        //qual o valor da variável a?
        alert("o valor da variável a é " + a);


    </script>

</body>

</html>
