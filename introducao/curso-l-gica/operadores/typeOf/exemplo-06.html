<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Document </title>
</head>

<body>
    <h1>Sexto exemplo</h1>
    <h2> operadores </h2>
    <h2>Boolean, Number e string - typeof</h2>

    <script >
        let mensagem = "Olá, sou uma 'mensagem de texto!'";
        console.log(mensagem);
        console.log(typeof mensagem);

        console.log(typeof 0);
        console.log(typeof "0");
        console.log(typeof String(0));

        let isValid = true;
        console.log(isValid);

        console.log(typeof Boolean(0));
        console.log(typeof Boolean("0"));
        console.log(typeof Boolean (undefined));
        console.log(typeof Boolean (null));
        console.log(typeof Boolean (""));

        let naoDeclarado = null;
        console.log(naoDeclarado);
        naoDeclarado = 0;
        console.log(naoDeclarado);

        let n = parseFloat("a");
        console.log(n);
        console.log(typeof n);
        console.log("-----");
        console.log(typeof undefined);
        console.log(typeof null);
        console.log(typeof 0);
        console.log(typeof "");
        console.log(typeof true);


    </script>

</body>

</html>
