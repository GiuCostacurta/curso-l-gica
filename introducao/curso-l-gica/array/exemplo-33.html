<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Trigésimo terceiro exemplo</h1>
    <h2>arrays</h2>

    <script>
      let nomes = ["Pedro", "Mariana", "Natalia", "Gustavo", "Helio", "Lisieux"];

      let nomeDigitado = prompt("digite seu nome");

      nomes[nomes.length] = nomeDigitado;

      for (let i = 0; i < nomes.length; i++) {
        document.write("nome: " + nomes[i] + "<br>");
      }

      document.write("a lista de nomes possui " + nomes.length + " nomes");
    </script>
  </body>
</html>
