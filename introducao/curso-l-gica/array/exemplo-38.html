<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Trigésimo oitavo exemplo</h1>
    <h2>arrays</h2>
    <h3>soma ímpares</h3>

    <script>
      const numeros = [2, 3, 5, 6, 2, 1, 0, 9];

      let soma = 0;

      for(let i = 0; i < numeros.length; i++) {
        let n = numeros[i];
        if (n % 2 !== 0) {
          soma += n;
        }
      }

        document.write("A soma dos números ímpares é: " + soma + "<br>");
        
    </script>
  </body>
</html>
